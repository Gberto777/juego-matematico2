<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Suma (arriba izquierda) -->
  <g fill="#fcd34d">
    <rect x="120" y="158" width="112" height="36" rx="18"/>
    <rect x="158" y="120" width="36" height="112" rx="18"/>
  </g>
  <!-- Resta (arriba derecha) -->
  <rect x="280" y="158" width="112" height="36" rx="18" fill="#ffffff"/>
  <!-- Multiplicación (abajo izquierda) -->
  <g fill="#ffffff" transform="rotate(45 176 336)">
    <rect x="120" y="318" width="112" height="36" rx="18"/>
    <rect x="158" y="280" width="36" height="112" rx="18"/>
  </g>
  <!-- Igual (abajo derecha) -->
  <g fill="#6ee7b7">
    <rect x="280" y="294" width="112" height="32" rx="16"/>
    <rect x="280" y="346" width="112" height="32" rx="16"/>
  </g>
</svg>
